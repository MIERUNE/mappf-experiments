name: Ishikari CI

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/codecov.yml"
      - "crates/ishikari-core/**"
      - "crates/mmpf-auth/**"
      - "crates/mmpf-cluster/**"
      - "crates/mmpf-common/**"
      - "crates/mmpf-http/**"
      - "crates/mmpf-pmtiles/**"
      - "crates/mmpf-terrain/**"
      - "servers/ishikari/**"
      - "sims/ishikari-sim/**"
      - "demo-deploy/ishikari/**"
      - ".github/workflows/ishikari-ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/codecov.yml"
      - "crates/ishikari-core/**"
      - "crates/mmpf-auth/**"
      - "crates/mmpf-cluster/**"
      - "crates/mmpf-common/**"
      - "crates/mmpf-http/**"
      - "crates/mmpf-pmtiles/**"
      - "crates/mmpf-terrain/**"
      - "servers/ishikari/**"
      - "sims/ishikari-sim/**"
      - "demo-deploy/ishikari/**"
      - ".github/workflows/ishikari-ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WORKSPACE_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy,rustfmt,llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-llvm-cov@0.8.6
      - name: Configure sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      # rust-cache intentionally excludes workspace artifacts; sccache handles
      # content-identical workspace compilation after Cargo's freshness check.
      - name: Cache Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: . -> target
          key: ishikari
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: >-
          cargo clippy -p mmpf-auth -p mmpf-cluster -p mmpf-common -p mmpf-http -p mmpf-pmtiles -p ishikari-core -p ishikari -p ishikari-sim
          -p mmpf-terrain --all-targets --locked --
          -D warnings
          -D clippy::unchecked_time_subtraction
          -D clippy::large_futures
          -D clippy::large_stack_arrays
          -D clippy::unused_async
      - name: Clippy schema generation
        run: >-
          cargo clippy -p ishikari --all-targets --features unstable-schemas --locked --
          -D warnings
          -D clippy::unchecked_time_subtraction
          -D clippy::large_futures
          -D clippy::large_stack_arrays
          -D clippy::unused_async
      # Accumulate both feature configurations into one report. --no-report
      # also prevents cargo-llvm-cov from cleaning between the two test runs.
      - name: Test workspace and collect coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report \
            -p mmpf-auth -p mmpf-cluster -p mmpf-common -p mmpf-http -p mmpf-pmtiles \
            -p ishikari-core -p ishikari -p ishikari-sim -p mmpf-terrain \
            --all-targets --locked
          cargo llvm-cov --no-report \
            -p ishikari-core --all-targets --no-default-features --locked
          # The schema-generation feature carries the guards that keep the
          # published artifacts honest: that every configuration key maps to a
          # flag without a default, and that the API description covers the
          # delivery surface and nothing beyond it. Those tests only compile with
          # the feature on, so a default-only run would never execute them.
          cargo llvm-cov --no-report \
            -p ishikari --all-targets --features unstable-schemas --locked
          cargo llvm-cov report --lcov --output-path lcov-ishikari.info
      # Generation runs outside the test harness, so a panic or an unserialisable
      # value would otherwise only surface when someone published an artifact.
      - name: Generate schema artifacts
        run: |
          set -euo pipefail
          cargo run -q -p ishikari --features unstable-schemas --locked -- \
            gen-schemas config > config.schema.json
          cargo run -q -p ishikari --features unstable-schemas --locked -- \
            gen-schemas openapi > openapi.json
          python3 - <<'PY'
          import json
          config = json.load(open("config.schema.json"))
          openapi = json.load(open("openapi.json"))
          assert config["properties"], "configuration schema described no settings"
          assert openapi["paths"], "API description covered no routes"
          print(
              f"config settings: {len(config['properties'])}, "
              f"described routes: {len(openapi['paths'])}"
          )
          PY
      - name: Upload schema artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ishikari-schemas
          path: |
            config.schema.json
            openapi.json
          if-no-files-found: error
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov-ishikari.info
          flags: ishikari,shared
          name: ishikari
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
