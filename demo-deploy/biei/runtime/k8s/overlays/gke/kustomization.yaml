apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: map-demo

resources:
  - healthcheck.yaml
  - httproute.yaml
  - podmonitoring.yaml
  - networkpolicy.yaml
  - hpa.yaml
  - ../../base

images:
  - name: biei
    newName: asia-northeast1-docker.pkg.dev/mappf-experiment/biei/biei
    digest: sha256:c58273aea4868f57325dde42e2fb5e2ac00c92c1c3aa50b32849c840a1da848e

patches:
  - path: patch-deployment.yaml
  # The HPA owns replica count; drop the base Deployment's fixed replicas so
  # `kubectl apply` doesn't reset the autoscaler's decision on every deploy.
  - target:
      kind: Deployment
      name: biei
    patch: |-
      - op: remove
        path: /spec/replicas
