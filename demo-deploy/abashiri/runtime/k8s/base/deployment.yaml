apiVersion: apps/v1
kind: Deployment
metadata:
  name: abashiri
  labels:
    app: abashiri
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: abashiri
  template:
    metadata:
      labels:
        app: abashiri
    spec:
      serviceAccountName: abashiri
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: abashiri
          image: abashiri:dev
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ABASHIRI_HTTP_ADDR
              value: "0.0.0.0:8080"
            - name: RUST_LOG
              value: "abashiri=info"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
