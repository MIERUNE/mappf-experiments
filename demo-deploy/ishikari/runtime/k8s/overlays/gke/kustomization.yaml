apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: map-demo

resources:
  - healthcheck.yaml
  - httproute.yaml
  - podmonitoring.yaml
  - networkpolicy.yaml
  - hpa.yaml
  - ../../base

images:
  - name: ishikari
    newName: asia-northeast1-docker.pkg.dev/mappf-experiment/ishikari/ishikari
    digest: sha256:f18a8417244098332ec1923d1d881ee644b41ea1a4f6b1203f16a49e7606171b

patches:
  - path: patch-serviceaccount.yaml
  - path: patch-deployment.yaml
  # The HPA owns replica count; drop the base Deployment's fixed replicas so
  # `kubectl apply` doesn't reset the autoscaler's decision on every deploy.
  - target:
      kind: Deployment
      name: ishikari
    patch: |-
      - op: remove
        path: /spec/replicas
