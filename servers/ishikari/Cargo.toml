[package]
name = "ishikari"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The Ishikari tile and map resource server"
repository.workspace = true
publish = false

[[bin]]
name = "ishikari"
path = "src/main.rs"

[features]
default = []
# Schema and API-description generation, exposed as an `ishikari gen-schemas`
# subcommand that short-circuits before the server starts. Named `unstable-`
# because neither artifact is a compatibility promise yet. A generating build
# must enable every feature that contributes configuration or routes, or the
# artifact is silently incomplete.
unstable-schemas = ["dep:schemars", "dep:utoipa"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
brotli.workspace = true
bytes.workspace = true
clap.workspace = true
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
futures-util.workspace = true
httpdate.workspace = true
ishikari-core = { workspace = true, features = ["cloud"] }
mlt-core.workspace = true
mmpf-auth.workspace = true
mmpf-cluster.workspace = true
mmpf-common.workspace = true
mmpf-http = { workspace = true, features = ["serve"] }
mmpf-terrain = { workspace = true, features = ["raster-encode"] }
moka.workspace = true
object_store.workspace = true
pbf_font_tools.workspace = true
reqwest = { workspace = true, features = ["rustls", "http2"] }
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
twox-hash.workspace = true
url.workspace = true
utoipa = { workspace = true, optional = true }
zstd.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "test-util"] }
tower = { version = "0.5", features = ["util"] }
