server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /console-config.json {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http: https:; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
